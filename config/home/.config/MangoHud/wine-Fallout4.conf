# MangoHud settings used only for Fallout4.exe (Proton). Enabled by MANGOHUD=1
# in the Cosmoem Steam shortcut's launch options.
position=top-left
fps
frametime=0
gpu_stats
vram
ram
cpu_stats
toggle_hud=Shift_R+F12
# Logging: Shift_L+F2 starts/stops a CSV log (VRAM over a whole session)
toggle_logging=Shift_L+F2
output_folder=/home/darryl/Games/Cosmoem-mangohud-logs
log_interval=1000
