# kitty config for KDE Plasma. Formerly split across ~/.config/hypr/UserConfigs/kitty.conf
# and a wallust color file (JaKooLit Hyprland); merged here 2026-11-25 so kitty no
# longer depends on the Hyprland folder. Colors are fixed values from that wallust file.



font_family FantasqueSansM Nerd Font Mono
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# Fix window split opening new window  in kitty 0.49+ 
remember_window_size no

# change to x11 or wayland or leave auto
linux_display_server auto
allow_remote_control socket-only  
# There current exists a remote exploit for this 9/2026
# allow_remote_control socket-only    # There current exists a remote exploit for this 9/2026

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

# foreground/background/cursor are set by the active theme

# KDE only blurs behind windows that ask for it
background_blur 1

# ---- colors (from wallust, 2026-11-03) ----
